    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px; padding: 24px; text-align: center;
        background: radial-gradient(900px 400px at 70% -10%, #fff2c9, transparent 60%), #fffdf7;
        color: #2c2521;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: #c89b19; }
      h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.1; }
      p { max-width: 42ch; color: #6b4e3d; font-size: 1.05rem; line-height: 1.6; }
      a.btn {
        margin-top: 8px; display: inline-block;
        background: #f4c542; color: #2c2521; font-weight: 600;
        padding: 12px 24px; border-radius: 999px; text-decoration: none;
        box-shadow: 0 10px 24px -10px rgba(200,155,25,0.8);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a.btn:hover { transform: translateY(-2px); background: #e0b02f; }
      svg { width: min(280px, 70vw); height: auto; }
      @media (prefers-reduced-motion: reduce) { a.btn:hover { transform: none; } .steam { animation: none; } }
      @keyframes steam { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: .5; } 100% { opacity: 0; transform: translateY(-14px); } }
      .steam { animation: steam 3s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 240 150" role="img" aria-label="A tipped-over coffee mug">

        <path d="M150 70 q6 -8 0 -16" fill="none" stroke="#d9c48a" stroke-width="3" stroke-linecap="round" />
        <path d="M164 70 q-6 -8 0 -16" fill="none" stroke="#d9c48a" stroke-width="3" stroke-linecap="round" />

    </svg>

    <h1>This page wandered off the desk.</h1>
